<div class="page">
    <h4 class="mb-3">📍 Места</h4>
    {% if places %}
    <div class="row">
        {% for p in places %}
        <div class="card" style="width: calc(33.33% - 7px);">
            <b>{{ p.name }}</b>
            <p class="text-s">{{ p.addr }}</p>
            <a href="/place/{{ p.id }}/del" class="btn btn-r btn-s">Удалить</a>
        </div>
        {% endfor %}
    </div>
    {% else %}<p class="text-s text-c">Нет мест</p>{% endif %}
</div>
