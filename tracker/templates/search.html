<div class="left-panel">
    <div class="panel-content">
        <form method="POST" action="/search" class="mb-3">
            <label>Поиск мест</label>
            <input type="text" name="query" value="{{ query }}" placeholder="кафе, аптека..." required class="mb-2">
            <button type="submit" class="btn btn-primary btn-sm w-100" style="background: #7c5cfc;">Найти</button>
        </form>
        {% if results %}
        <p class="text-secondary small mb-2">Найдено: {{ results|length }}</p>
        {% for place in results %}
        <div class="list-group-item-dark">
            <b>{{ place.name }}</b>
            <div class="text-secondary small">{{ place.addr }}</div>
            {% if current_user.is_authenticated %}
            <form method="POST" action="/save_place" class="mt-2">
                <input type="hidden" name="name" value="{{ place.name }}">
                <input type="hidden" name="addr" value="{{ place.addr }}">
                <input type="hidden" name="lat" value="{{ place.lat }}">
                <input type="hidden" name="lon" value="{{ place.lon }}">
                <input type="hidden" name="cat" value="{{ place.cat }}">
                <button type="submit" class="btn btn-success btn-sm py-0 px-2" style="font-size:11px;">💾 Сохранить</button>
            </form>
            {% endif %}
        </div>
        {% endfor %}
        {% endif %}
    </div>
</div>
<div class="right-panel"><div id="map"></div></div>
<script>
    ymaps.ready(function(){
        var map=new ymaps.Map('map',{center:[{{clat}},{{clon}}],zoom:13,controls:['zoomControl']});
        {% for place in results %}
        new ymaps.Placemark([{{place.lat}},{{place.lon}}],{balloonContent:'<b>{{place.name}}</b><br>{{place.addr}}'},{preset:'islands#blueIcon'}).addTo(map.geoObjects);
        {% endfor %}
        {% if results %}map.setBounds(map.geoObjects.getBounds());{% endif %}
    });
</script>
