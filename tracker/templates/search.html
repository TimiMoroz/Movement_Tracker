<div class="left-panel">
    <div class="panel-content">
        <form method="POST" action="/search" style="margin-bottom: 20px;">
            <label>Поиск</label>
            <input type="text" name="query" value="{{ query }}" placeholder="кафе, аптека..." required style="margin-bottom: 10px;">
            <button type="submit" class="btn btn-primary btn-block">Найти</button>
        </form>

        {% if results %}
            <p style="color: #888; font-size: 13px; margin-bottom: 10px;">Найдено: {{ results|length }}</p>
            {% for place in results %}
            <div class="list-item">
                <b>{{ place.name }}</b>
                <div style="color: #888; font-size: 12px;">{{ place.address }}</div>
                {% if current_user.is_authenticated %}
                <form method="POST" action="/save_place" style="margin-top: 8px;">
                    <input type="hidden" name="name" value="{{ place.name }}">
                    <input type="hidden" name="address" value="{{ place.address }}">
                    <input type="hidden" name="lat" value="{{ place.lat }}">
                    <input type="hidden" name="lon" value="{{ place.lon }}">
                    <input type="hidden" name="category" value="{{ place.category }}">
                    <button type="submit" class="btn btn-success btn-sm">Сохранить</button>
                </form>
                {% endif %}
            </div>
            {% endfor %}
        {% endif %}
    </div>
</div>

<div class="right-panel"><div id="map"></div></div>

<script>
    ymaps.ready(function() {
        var map = new ymaps.Map('map', { center: [{{ center_lat }}, {{ center_lon }}], zoom: 13 });
        {% for place in results %}
        new ymaps.Placemark([{{ place.lat }}, {{ place.lon }}], {
            balloonContent: '<b>{{ place.name }}</b><br>{{ place.address }}'
        }, { preset: 'islands#blueIcon' }).addTo(map.geoObjects);
        {% endfor %}
        {% if results %}map.setBounds(map.geoObjects.getBounds());{% endif %}
    });
</script>
