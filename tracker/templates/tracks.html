<!-- ЛЕВАЯ ПАНЕЛЬ -->
<div class="left-panel">
    <div class="panel-content">
        <h2 style="margin-bottom: 16px;">📋 Мои треки</h2>

        {% if tracks %}
            {% for track in tracks %}
            <div class="list-item">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <a href="/track/{{ track.id }}" style="color: var(--accent); text-decoration: none; font-weight: 500;">
                            {{ track.name }}
                        </a>
                        <div class="meta">
                            {{ track.date.strftime('%d.%m.%Y %H:%M') }} ·
                            {{ "%.2f"|format(track.distance) }} км ·
                            {{ track.points.count(',') // 2 + 1 }} точек
                        </div>
                    </div>
                    <a href="/track/{{ track.id }}/delete" class="btn btn-danger btn-sm" style="flex-shrink: 0;">✕</a>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div style="text-align: center; padding: 40px 20px; color: #888;">
                <p>Нет сохранённых треков</p>
                <a href="/" style="color: var(--accent);">Создать первый трек →</a>
            </div>
        {% endif %}
    </div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ (КАРТА) -->
<div class="right-panel">
    <div id="map"></div>
</div>

<script>
    ymaps.ready(function() {
        var map = new ymaps.Map('map', {
            center: [55.751244, 37.618423],
            zoom: 11,
            controls: ['zoomControl', 'fullscreenControl']
        });

        // Показываем все треки на карте
        var allPoints = [];

        {% for track in tracks %}
            {% set points = track.points | replace("'", '"') %}
            (function() {
                try {
                    var pts = JSON.parse('{{ points | safe }}');
                    if (pts.length > 1) {
                        // Линия трека
                        map.geoObjects.add(new ymaps.Polyline(pts, {}, {
                            strokeColor: '#7c5cfc',
                            strokeWidth: 3,
                            strokeOpacity: 0.6
                        }));
                        // Метка в центре трека
                        var center = pts[Math.floor(pts.length / 2)];
                        map.geoObjects.add(new ymaps.Placemark(center, {
                            balloonContent: '<b>{{ track.name }}</b><br>{{ "%.2f"|format(track.distance) }} км<br>{{ track.date.strftime("%d.%m.%Y") }}'
                        }, {
                            preset: 'islands#blueIcon'
                        }));
                        allPoints = allPoints.concat(pts);
                    }
                } catch(e) {}
            })();
        {% endfor %}

        if (allPoints.length > 0) {
            map.setBounds(map.geoObjects.getBounds(), { checkZoomRange: true });
        }
    });
</script>
