<div class="page">
    <h4 class="mb-3">⭐ Избранные метки</h4>
    {% if favs %}
        {% for f in favs %}
        <div class="item flex" style="cursor:pointer">
            <div class="f1" onclick="viewFavorite({{ f.marker.lat }}, {{ f.marker.lon }}, '{{ f.marker.name|e }}', '{{ f.marker.desc|e }}', '{{ f.marker.author.username|e }}')">
                <b>{{ f.marker.name }}</b>
                <span class="badge" style="background:{{ cats[f.marker.cat]['color'] }}">{{ cats[f.marker.cat]['icon'] }} {{ cats[f.marker.cat]['name'] }}</span>
                <div class="text-s">{{ f.marker.desc[:80] if f.marker.desc else 'Нет описания' }}</div>
                <div class="text-s">Автор: {{ f.marker.author.username }}</div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p class="text-s text-c">Нет избранных меток</p>
    {% endif %}
</div>

<div class="right">
    <div id="map"></div>
</div>

<script>
    var map

    ymaps.ready(function() {
        map = new ymaps.Map('map', {
            center: [55.751244, 37.618423],
            zoom: 11,
            controls: ['zoomControl']
        })
    })

    function viewFavorite(lat, lon, name, desc, author) {
        if (!lat || !lon || lat === 0 || lon === 0) {
            alert('❌ Эта метка больше не существует (была удалена автором)')
            return
        }

        map.geoObjects.removeAll()

        var pm = new ymaps.Placemark([lat, lon], {
            balloonContent: '<b>' + name + '</b><br>' + (desc || 'Нет описания') + '<br><span style="color:#888;font-size:11px">Автор: ' + author + '</span>'
        }, {
            preset: 'islands#redIcon'
        })

        map.geoObjects.add(pm)
        map.setCenter([lat, lon], 16)
        pm.balloon.open()
    }
</script>
