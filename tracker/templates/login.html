<div class="auth-center">
    <div class="auth-box">
        <h2>Вход</h2>
        <form method="POST" action="/login">
            <label>Логин</label>
            <input type="text" name="username" required style="margin-bottom: 12px;">
            <label>Пароль</label>
            <input type="password" name="password" required style="margin-bottom: 16px;">
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p style="text-align: center; margin-top: 14px; font-size: 13px; color: #888;">
            Нет аккаунта? <a href="/register" style="color: #7c5cfc;">Регистрация</a>
        </p>
    </div>
</div>
