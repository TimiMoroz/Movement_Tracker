<div style="flex: 1; overflow-y: auto; padding: 24px;">
    <h1>🍪 Куки</h1>
    <div style="background: var(--panel); padding: 16px; border-radius: 12px; margin-top: 16px;">
        <p><strong>Посещений:</strong> {{ info.visit_count }}</p>
        <p><strong>Тема:</strong> {{ info.theme }}</p>
        {% for k,v in info.all_cookies.items() %}
        <p style="font-size:0.85em;"><span style="color:#888;">{{ k }}:</span> {{ v[:60] }}{% if v|length>60 %}...{% endif %}</p>
        {% endfor %}
    </div>
    <a href="/reset_cookies" class="btn btn-danger btn-sm" style="margin-top: 12px;">Сбросить</a>
</div>
