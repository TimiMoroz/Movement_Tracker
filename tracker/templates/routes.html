<div class="page">
    <h4 class="mb-3">📋 Сохранённые маршруты</h4>
    {% if routes %}
        {% for r in routes %}
        <div class="item flex">
            <div class="f1" onclick="location.href='/route/{{ r.id }}'">
                <b>{{ r.name }}</b>
                <div class="text-s">{{ r.date.strftime('%d.%m.%Y %H:%M') }} · {{ "%.2f"|format(r.dist) }} км</div>
            </div>
            <a href="/route/{{ r.id }}/del" class="btn btn-r btn-s">✕</a>
        </div>
        {% endfor %}
    {% else %}
        <p class="text-s text-c">Нет сохранённых маршрутов</p>
    {% endif %}
</div>
